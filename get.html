<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Details</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(120deg, #eef2ff, #f8fafc);
      padding: 40px;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #1e293b;
    }

    table {
      width: 80%;
      margin: auto;
      border-collapse: collapse;
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }

    th {
      background: #2563eb;
      color: white;
      padding: 14px;
      text-transform: uppercase;
      font-size: 13px;
    }

    td {
      padding: 12px;
      text-align: center;
      border-bottom: 1px solid #e5e7eb;
      color: #334155;
    }

    /* 1. Red: Expired / Completed */
    tr.expired {
      background-color: #fee2e2 !important;
    }
    tr.expired td {
      color: #dc2626 !important;
      font-weight: 600;
    }

    /* 2. Orange: Near Completion (Within 60 Days) */
    tr.warning {
      background-color: #ffedd5 !important;
    }
    tr.warning td {
      color: #ea580c !important;
      font-weight: 600;
    }

    /* 3. Green: Time Remaining (> 60 Days) */
    tr.active {
      background-color: #dcfce7 !important;
    }
    tr.active td {
      color: #16a34a !important;
      font-weight: 600;
    }

    @media (max-width: 768px) {
      table { width: 100%; }
    }
  </style>
</head>
<body>

<h2>Account Details</h2>

<table>
  <thead>
    <tr>
      <th>Name</th>
      <th>Account No or Phone</th>
      <th>Start Date</th>
      <th>End Date</th>
      <th>Plan</th>
    </tr>
  </thead>
  <tbody id="data"></tbody>
</table>

<script>
// Helper function to safely convert string formats to Date
function parseCustomDate(dateStr) {
  if (!dateStr) return null;
  
  if (dateStr.includes('-')) {
    const parts = dateStr.split('-');
    if (parts.length === 3) {
      return new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
    }
  }
  
  if (dateStr.includes('/')) {
    const parts = dateStr.split('/');
    if (parts.length === 3) {
      return new Date(parseInt(parts[2]), parseInt(parts[1]) - 1, parseInt(parts[0]));
    }
  }

  const fallbackDate = new Date(dateStr);
  return isNaN(fallbackDate.getTime()) ? null : fallbackDate;
}

// Function to calculate status and priority rank
function getRowStatus(row, today) {
  const endDateVal = row["End Date"] || row["endDate"];
  const endDate = parseCustomDate(endDateVal);
  
  if (!endDate) {
    return { class: '', rank: 4 }; // Default for missing dates
  }

  endDate.setHours(0, 0, 0, 0);
  const diffTime = endDate.getTime() - today.getTime();
  const daysRemaining = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

  if (daysRemaining < 0) {
    return { class: 'expired', rank: 1 }; // RED
  } else if (daysRemaining <= 60) {
    return { class: 'warning', rank: 2 }; // ORANGE
  } else {
    return { class: 'active', rank: 3 };  // GREEN
  }
}

const today = new Date();
today.setHours(0, 0, 0, 0);

fetch("https://script.google.com/macros/s/AKfycbzv4ytZz4u-xz1GFJI7r87DvS_6MtV8gyNR1rUpcRlCsQ38sNR1oS3fKfyfd28PU8n2/exec")
  .then(res => res.json())
  .then(data => {
    // 1. Process each item and attach status class & priority rank
    const processedData = data.map(r => {
      const statusInfo = getRowStatus(r, today);
      return {
        ...r,
        statusClass: statusInfo.class,
        rank: statusInfo.rank
      };
    });

    // 2. Sort data: Priority Rank first (Red -> Orange -> Green), then by End Date
    processedData.sort((a, b) => {
      if (a.rank !== b.rank) {
        return a.rank - b.rank; // Priority order: 1 (Red), 2 (Orange), 3 (Green)
      }
      // Optional tie-breaker: sort by End Date within the same color group
      const dateA = parseCustomDate(a["End Date"] || a["endDate"]);
      const dateB = parseCustomDate(b["End Date"] || b["endDate"]);
      return (dateA || 0) - (dateB || 0);
    });

    // 3. Render HTML
    let html = "";
    processedData.forEach(r => {
      const rowClassAttr = r.statusClass ? `class="${r.statusClass}"` : '';
      html += `
        <tr ${rowClassAttr}>
          <td>${r.Name || r.name || ''}</td>
          <td>${r["Account Number"] || r.accountNumber || ''}</td>
          <td>${r["Start Date"] || r.startDate || ''}</td>
          <td>${r["End Date"] || r.endDate || ''}</td>
          <td>${r.Plan || r.plan || ''}</td>
        </tr>`;
    });
    
    document.getElementById("data").innerHTML = html;
  })
  .catch(err => console.error("Error fetching data: ", err));
</script>

</body>
</html>
