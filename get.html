<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Details</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(120deg, #eef2ff, #f8fafc);
      padding: 40px;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #1e293b;
    }

    table {
      width: 80%;
      margin: auto;
      border-collapse: collapse;
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }

    th {
      background: #2563eb;
      color: white;
      padding: 14px;
      text-transform: uppercase;
      font-size: 13px;
    }

    td {
      padding: 12px;
      text-align: center;
      border-bottom: 1px solid #e5e7eb;
      color: #334155;
    }

    /* 1. Red State: Completed / Expired */
    .expired {
      background-color: #fee2e2 !important; /* Soft light red */
    }
    .expired td {
      color: #dc2626 !important; /* Bold red text */
      font-weight: 600;
    }
    .expired:hover {
      background-color: #fca5a5 !important;
    }

    /* 2. Orange State: Within 60 Days */
    .warning {
      background-color: #ffedd5 !important; /* Soft light orange */
    }
    .warning td {
      color: #ea580c !important; /* Bold orange text */
      font-weight: 600;
    }
    .warning:hover {
      background-color: #fed7aa !important;
    }

    /* 3. Green State: More than 60 Days */
    .active {
      background-color: #dcfce7 !important; /* Soft light green */
    }
    .active td {
      color: #16a34a !important; /* Bold green text */
      font-weight: 600;
    }
    .active:hover {
      background-color: #bbf7d0 !important;
    }

    @media (max-width: 768px) {
      table {
        width: 100%;
      }
    }
  </style>
</head>
<body>

<h2>Account Details</h2>

<table>
  <thead>
    <tr>
      <th>Name</th>
      <th>Account No or Phone</th>
      <th>Start Date</th>
      <th>End Date</th>
      <th>Plan</th>
    </tr>
  </thead>
  <tbody id="data"></tbody>
</table>

<script>
// Normalize today's date to midnight for accurate calculation
const today = new Date();
today.setHours(0, 0, 0, 0);

fetch("https://script.google.com/macros/s/AKfycbzv4ytZz4u-xz1GFJI7r87DvS_6MtV8gyNR1rUpcRlCsQ38sNR1oS3fKfyfd28PU8n2/exec")
  .then(res => res.json())
  .then(data => {
    // Sort data in ascending order based on Start Date
    data.sort((a, b) => new Date(a["Start Date"]) - new Date(b["Start Date"]));

    let html = "";
    
    data.forEach(r => {
      let rowClass = "";
      
      if (r["End Date"]) {
        // Parse the End Date string (YYYY-MM-DD or standard date format)
        const endDate = new Date(r["End Date"]);
        endDate.setHours(0, 0, 0, 0);
        
        if (!isNaN(endDate.getTime())) {
          // Calculate difference in whole days
          const diffTime = endDate.getTime() - today.getTime();
          const daysRemaining = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

          if (daysRemaining < 0) {
            // Completed / Expired -> RED
            rowClass = 'class="expired"';
          } else if (daysRemaining <= 60) {
            // Near complete (Within 60 days) -> ORANGE
            rowClass = 'class="warning"';
          } else {
            // Active (More than 60 days remaining) -> GREEN
            rowClass = 'class="active"';
          }
        }
      }

      html += `
        <tr ${rowClass}>
          <td>${r.Name || ''}</td>
          <td>${r["Account Number"] || ''}</td>
          <td>${r["Start Date"] || ''}</td>
          <td>${r["End Date"] || ''}</td>
          <td>${r.Plan || ''}</td>
        </tr>`;
    });
    document.getElementById("data").innerHTML = html;
  })
  .catch(err => console.error("Error fetching data: ", err));
</script>

</body>
</html>
